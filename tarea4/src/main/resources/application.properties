# ==============================
# CONFIGURACIÓN DE LA APLICACIÓN
# ==============================
spring.application.name=tarea4

# Puerto del servidor
server.port=8081
# ==============================
# CONFIGURACIÓN DE BASE DE DATOS
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/tarea2?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=cc5002
spring.datasource.password=programacionweb

# Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=update  
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
