{% extends 'base.html' %}

{% block title %}Estadisticas - Cat&Dog{% endblock %}

{% block content %}

  <h1>Estadísticas</h1>

  <div class="container-grafico">
    <div class="fila-graficos">
    <div class="grafico-contenedor">
      <h2 class="subtitle">Adopciones por especie</h2>
      <img class="grafico-cuadrado" src="{{ url_for('static', filename = 'img/Gráfico_2.png' )}}" alt="Adopciones por especie">
    </div>
    <div class="grafico-contenedor">
      <h2 class="subtitle">Cantidad de avisos por especie cada mes</h2>
      <img class="grafico-horizontal-small" src="{{ url_for('static', filename = 'img/Gráfico_3.png' )}}" alt="Tasa de éxito">
    </div>
  </div>
    <div>
      <h2 class="subtitle"> Avisos por día</h2>
      <img class="grafico-horizontal" src="{{ url_for('static', filename = 'img/Gráfico_1.png' )}}" alt="Por día">
    </div>
    <button onclick="window.history.length > 1 ? window.history.back() : window.location.href='index.html'" class="button">
          ⬅ Volver atrás
    </button>
  </div>
{% endblock %}
